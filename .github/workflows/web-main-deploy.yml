name: Build & Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - "projects/web/**"
      - ".github/workflows/web-main-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: "web"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: ">=22.13.0"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install deps
        working-directory: .
        run: npm ci
      - name: Build ${{ env.PROJECT_NAME }}
        run: npm run build
      # Could easily split out builds and deploys using this strategy
      - name: Save build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT_NAME }}-build-${{ github.SHA }}
          path: ./projects/web/dist
          retention-days: 1

  terraform:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/web/terraform
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Retrieve build
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.PROJECT_NAME }}-build-${{ github.SHA }}
          path: ./projects/web/dist

      - name: Terraform Init
        run: terraform init -backend-config=dev.tfbackend

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
